<!-- SUB HERO PLAIN: 이미지 없이 페이지 제목과 브레드크럼만 표시 -->
<section class="sub-hero sub-hero--plain" aria-labelledby="sub-hero-title">
  <div class="container sub-hero__content">
    <p class="sub-hero__eyebrow" lang="en">{{eyebrow}}</p>
    <h2 class="sub-hero__title" id="sub-hero-title">{{pageTitle}}</h2>

    <nav class="breadcrumb" aria-label="현재 위치">
      <ol class="breadcrumb__list">
        <li class="breadcrumb__item">
          <a class="breadcrumb__link" href="_template.html">
            <i class="ri-home-5-line" aria-hidden="true"></i><span class="sr-only">홈</span>
          </a>
        </li>
        <li class="breadcrumb__item"><span lang="en">{{category}}</span></li>
        <li class="breadcrumb__item"><span aria-current="page">{{pageTitle}}</span></li>
      </ol>
    </nav>
  </div>
</section>
