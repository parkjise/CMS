<!-- MEMBER AGREE: 약관 동의 묶음 — 전체 동의 + 이용약관(필수) · 개인정보처리방침(필수) · 마케팅 알림(선택) (회원 공통 — 가입·소셜 가입)
  사용: <div data-include="components/sub/member-agree.html" data-id="jn"></div>
  - 전체 동의 ↔ 개별 동의 연동: assets/js/member-form.js / [보기] 는 약관 페이지 연결 전 자리
-->
<fieldset class="member-form__agree" data-agree-group>
  <legend class="sr-only">약관 동의</legend>
  <div class="board-form__row board-form__row--check member-form__agree-all">
    <input class="board-form__checkbox" type="checkbox" id="{{id}}-ag-all" data-agree-all />
    <label class="board-form__check" for="{{id}}-ag-all">약관에 모두 동의합니다.</label>
  </div>
  <div class="board-form__row board-form__row--check">
    <input class="board-form__checkbox" type="checkbox" id="{{id}}-ag-terms" name="agree_terms" required data-error="(필수) 이용약관에 동의해 주세요." />
    <label class="board-form__check" for="{{id}}-ag-terms">이용약관 동의 <span class="member-form__must">(필수)</span></label>
    <a class="board-form__terms" href="#" aria-label="이용약관 보기">[보기]</a>
  </div>
  <div class="board-form__row board-form__row--check">
    <input class="board-form__checkbox" type="checkbox" id="{{id}}-ag-privacy" name="agree_privacy" required data-error="(필수) 개인정보처리방침에 동의해 주세요." />
    <label class="board-form__check" for="{{id}}-ag-privacy">개인정보처리방침 동의 <span class="member-form__must">(필수)</span></label>
    <a class="board-form__terms" href="#" aria-label="개인정보처리방침 보기">[보기]</a>
  </div>
  <div class="board-form__row board-form__row--check">
    <input class="board-form__checkbox" type="checkbox" id="{{id}}-ag-mkt" name="agree_marketing" value="Y" />
    <label class="board-form__check" for="{{id}}-ag-mkt">마케팅 · 이벤트 알림 수신 <span class="member-form__optional">(선택)</span></label>
  </div>
  <p class="member-form__agree-note">
    ※ 예약 확정 · 변경 안내는 동의 여부와 관계없이 문자로 보내드립니다. 마케팅 수신은 마이페이지에서 언제든 바꿀 수 있어요.
  </p>
</fieldset>
