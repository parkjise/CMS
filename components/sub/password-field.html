<!-- PASSWORD FIELD: 비밀번호 입력 + 보기 버튼 + 조건 표시(8자 이상 · 영문 · 숫자) (회원 공통 — 가입·재설정·비밀번호 변경)
  사용: <div data-include="components/sub/password-field.html" data-id="jn-pw" data-label="비밀번호"></div>
  - 비밀번호 확인 칸은 각 화면에서 data-match="#{id}" 로 따로 둠
  - 보기 버튼·조건 표시: assets/js/member-form.js / 규칙은 기획서 16.3 (영문+숫자 포함 8자 이상)
-->
<div class="board-form__row">
  <label class="board-form__label" for="{{id}}">{{label}}<span class="board-form__req" aria-hidden="true">*</span></label>
  <div class="member-form__password">
    <input class="board-form__input" type="password" id="{{id}}" name="password" placeholder="영문, 숫자 포함 8자 이상" autocomplete="new-password" maxlength="20" aria-describedby="{{id}}-rules" required pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,20}" data-pw-input data-error="{{label}}를 입력해 주세요." data-error-pattern="영문, 숫자를 포함하여 8자 이상 입력해 주세요." />
    <button class="member-form__eye" type="button" aria-label="비밀번호 보기" aria-pressed="false" data-pw-toggle>
      <i class="ri-eye-line" aria-hidden="true"></i>
    </button>
  </div>
  <ul class="member-form__rules" id="{{id}}-rules" aria-label="비밀번호 조건" data-pw-rules>
    <li class="member-form__rule" data-rule="length">8자 이상<span class="sr-only" data-rule-state> 미충족</span></li>
    <li class="member-form__rule" data-rule="letter">영문<span class="sr-only" data-rule-state> 미충족</span></li>
    <li class="member-form__rule" data-rule="digit">숫자<span class="sr-only" data-rule-state> 미충족</span></li>
  </ul>
</div>
