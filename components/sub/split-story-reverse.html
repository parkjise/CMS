<!-- SPLIT STORY (반전): 사진 + 안내 문구 | 큰 영문 제목 + 국문 소제목 + 설명 (서브 공통)
  용도 예: 일하는 방식, 핵심 원리 설명
  스타일은 split-story 블록 공유 (.split-story--reverse)
-->
<section class="split-story split-story--reverse" aria-labelledby="split-story-reverse-title">
  <div class="container split-story__inner">
    <figure class="split-story__media">
      <img class="split-story__image" src="./assets/images/unsplash/business-meeting.jpg" alt="긴 목재 테이블과 의자가 배치된 회의실" loading="lazy" />
      <figcaption class="split-story__caption">
        사례와 결과는 모든 고객에게 동일하게 나타나지 않습니다.<br />
        실제 진행은 고객의 목적, 일정, 예산, 환경을 함께 고려해 결정합니다.
      </figcaption>
    </figure>
    <div class="story-text split-story__text">
      <h2 class="story-text__title" id="split-story-reverse-title">
        <span class="story-text__en" lang="en">OUR APPROACH</span>
        <span class="story-text__sub">결과 자체보다<br />‘과정이 만드는 신뢰’에 주목합니다</span>
      </h2>
      <div class="story-text__desc">
        <p>
          좋은 결과는 혼자 만들어지지 않습니다.<br />
          충분한 상담과 정확한 진단, 꼼꼼한 준비가<br />
          고객의 선택과 경험 전체에 영향을 줍니다.
        </p>
        <p>
          한 번에 많은 것을 바꾸는 것이 아니라<br />
          지금 필요한 것부터 차근차근 설계하고 확인하는 것.<br />
          이것이 ONDO가 일하는 방식이며<br />
          모든 서비스의 출발점입니다.
        </p>
        <p>
          <strong>
            ONDO는 고객이 안심하고 맡길 수 있는<br />
            과정을 어떻게 설계할 것인가에 초점을 둡니다.
          </strong>
        </p>
      </div>
    </div>
  </div>
</section>
