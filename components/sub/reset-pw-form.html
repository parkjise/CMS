<!-- RESET PW FORM: 새 비밀번호 설정 — 새 비밀번호 + 확인 → 변경 완료(3초 뒤 로그인 이동) / 만료·사용된 링크 (기획서 16.6 Step 3·4)
  - 검사: .board-form + assets/js/board-form.js / 단계 전환·카운트다운: assets/js/member-form.js ([data-reset-pw])
  - 목업: reset-pw.html#expired 로 열면 만료 화면 (실제는 링크 token 을 POST /auth/reset-password 로 검증)
-->
<section class="board-form member-form" aria-labelledby="reset-pw-title">
  <div class="container">
    <form class="board-form__form" action="reset-pw.html" method="post" novalidate data-reset-pw data-step="form">
      <div class="board-form__panel board-form__panel--narrow">
        <h2 class="member-form__heading" id="reset-pw-title">새 비밀번호 설정</h2>
        <p class="member-form__desc">이전에 쓰던 비밀번호와 다른 비밀번호를 권장해요.</p>

        <div class="board-form__list">
          <div data-include="components/sub/password-field.html" data-id="rp-pw" data-label="새 비밀번호"></div>
          <div class="board-form__row">
            <label class="board-form__label" for="rp-pw2">새 비밀번호 확인<span class="board-form__req" aria-hidden="true">*</span></label>
            <div class="member-form__password">
              <input class="board-form__input" type="password" id="rp-pw2" name="password_confirm" placeholder="새 비밀번호를 한 번 더 입력해 주세요." autocomplete="new-password" maxlength="20" required data-match="#rp-pw" data-error="새 비밀번호를 한 번 더 입력해 주세요." data-error-match="비밀번호가 일치하지 않습니다." />
              <button class="member-form__eye" type="button" aria-label="비밀번호 보기" aria-pressed="false" data-pw-toggle>
                <i class="ri-eye-line" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>

        <p class="board-form__status" role="status" aria-live="polite"></p>

        <button class="member-form__submit" type="submit">비밀번호 변경하기</button>
      </div>
    </form>

    <!-- ④ 변경 완료 -->
    <div class="board-form__panel board-form__panel--narrow member-form__done" data-step="done" tabindex="-1" hidden>
      <i class="ri-checkbox-circle-line member-form__done-icon" aria-hidden="true"></i>
      <h2 class="member-form__title">비밀번호가 변경되었습니다</h2>
      <p class="member-form__desc" role="status"><span data-countdown>3</span>초 후 로그인 페이지로 이동합니다.</p>
      <p class="member-form__notice">
        <i class="ri-shield-check-line" aria-hidden="true"></i>
        가입한 이메일과 휴대폰으로 변경 알림을 보냈어요. 본인이 아니라면 고객센터에 문의해 주세요.
      </p>
      <div class="member-form__buttons">
        <a class="member-form__submit" href="login.html">지금 로그인하기</a>
      </div>
    </div>

    <!-- 만료·사용된 링크 -->
    <div class="board-form__panel board-form__panel--narrow member-form__done" data-step="expired" tabindex="-1" hidden>
      <i class="ri-time-line member-form__done-icon member-form__done-icon--muted" aria-hidden="true"></i>
      <h2 class="member-form__title">유효하지 않거나 만료된 링크입니다</h2>
      <p class="member-form__desc">재설정 링크는 발송 후 30분 동안, 한 번만 사용할 수 있어요.</p>
      <div class="member-form__buttons">
        <a class="member-form__submit" href="find-pw.html">비밀번호 찾기 다시 시도</a>
      </div>
    </div>
  </div>
</section>
