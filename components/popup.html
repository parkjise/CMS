<!-- 팝업 딤 배경 (Dim / Backdrop - ELEV Clinic 스타일) -->
<div class="main-popup-bg" id="mainPopupBg" style="display: none;" aria-hidden="true"></div>

<!-- 팝업 (ELEV Clinic Style Multi-slide Popup) -->
<div class="main-popup-wrap" id="mainPopup" style="display: none;" role="dialog" aria-modal="true" aria-label="이벤트 및 공지 팝업">
  <div class="main-popup">
    <!-- 스와이퍼 슬라이드 영역 -->
    <div class="main-popup__body">
      <div class="swiper main-popup-slide">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <div class="main-popup__img">
              <a href="notice.html">
                <img src="./assets/images/popup/popup-1.jpg" alt="ELEV CLINIC 특별 프로모션" />
              </a>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="main-popup__img">
              <a href="notice.html">
                <img src="./assets/images/popup/popup-2.webp" alt="ELEV 시그니처 케어" />
              </a>
            </div>
          </div>
          <div class="swiper-slide">
            <div class="main-popup__img">
              <a href="notice.html">
                <img src="./assets/images/popup/popup-3.webp" alt="프리미엄 리프팅 프로그램" />
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 하단 컨트롤 바 (오늘 하루 보지 않기 + 페이징 + 닫기) -->
    <div class="main-popup-close-wrap">
      <label class="main-popup__check-label" for="popupCheck">
        <input type="checkbox" id="popupCheck" class="sr-only" />
        <span class="main-popup__check-icon" aria-hidden="true">
          <svg viewBox="0 0 512 512" fill="currentColor">
            <path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM369 209L241 337c-9.4 9.4-24.6 9.4-33.9 0l-64-64c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l47 47L335 175c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9z" />
          </svg>
        </span>
        <span class="main-popup__check-text">오늘 하루 보지 않기</span>
      </label>

      <!-- 스와이퍼 fraction 페이징 (1 / 3) -->
      <div class="swiper-pagination"></div>

      <!-- 닫기 버튼 -->
      <button type="button" class="main-popup-close" id="mainPopupClose" aria-label="팝업 닫기">
        닫기
      </button>
    </div>
  </div>
</div>
