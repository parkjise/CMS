# 슈퍼 어드민 SPA (Vite 빌드 정적 서빙) — 컨테이너 내부 :80
# 외부 라우팅/TLS/보안헤더는 상위 리버스 프록시(nginx/nginx.conf, T-080)가 담당.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 해시 파일명 정적 자산 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 라우팅: 없는 경로는 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }
}
