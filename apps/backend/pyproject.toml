[tool.poetry]
name = "cms-backend"
version = "0.1.0"
description = "멀티 테넌트 CMS SaaS 백엔드"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "*"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
greenlet = "*"
alembic = "^1.0"
asyncpg = "^0.30.0"
pydantic = {extras = ["email"], version = "^2.0"}
pydantic-settings = "^2.0"
python-jose = {extras = ["cryptography"], version = "^3.3"}
bcrypt = "^4.0"
Pillow = "^11.0"
celery = {extras = ["redis"], version = "^5.0"}
redis = "^5.0"
boto3 = "^1.0"
httpx = "^0.27.0"
langchain-openai = "*"
python-multipart = "*"
slowapi = "*"
python-dotenv = "*"
openpyxl = "^3.1.5"
pyotp = "^2.10.0"
jinja2 = "^3.1.6"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
httpx = "^0.27.0"
ruff = "^0.15.15"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
