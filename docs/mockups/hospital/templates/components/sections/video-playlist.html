<!-- VIDEO PLAYLIST: 유튜브 영상 — 대표 영상 플레이어 + 영상 목록 (신규 섹션 후보: data-new)
  - 영상은 data-video-id (유튜브 영상 ID, watch?v= 뒤의 11자리) 로 관리한다.
  - ID 를 실제 값으로 넣으면 썸네일이 자동으로 유튜브 썸네일(i.ytimg.com)로 바뀐다.
    'VIDEO_ID_' 로 시작하는 값은 샘플 → 로컬 이미지 썸네일 유지.
  - 대표 영상: 재생 버튼 클릭 시 그 자리에서 iframe(youtube-nocookie) 재생.
  - 목록 영상: 클릭 시 대표 영상 자리로 교체 (JS 없으면 유튜브 페이지로 이동).
  JS: assets/js/video-playlist.js
-->
<section class="video-playlist" id="film" aria-labelledby="video-playlist-title" data-new="true">
  <div class="container video-playlist__inner">
    <header class="section-head video-playlist__head">
      <p class="section-head__eyebrow" lang="en">BAZZAR Youtube</p>
      <h2 class="section-head__title" id="video-playlist-title">
        BAZZAR가 전하는 이야기,<br />
        영상으로 만나보세요
      </h2>
      <p class="section-head__desc">브랜드의 철학과 일상의 순간을 담은 공식 유튜브 채널</p>
    </header>

    <div class="video-playlist__body">
      <!-- 대표 영상 -->
      <div class="video-playlist__featured">
        <div class="video-playlist__player" data-video-id="VIDEO_ID_1">
          <button class="video-playlist__play" type="button">
            <img class="video-playlist__player-image" src="./assets/images/photo1.avif" alt="" />
            <span class="video-playlist__play-icon" aria-hidden="true">
              <i class="ri-play-fill"></i>
            </span>
            <span class="sr-only">영상 재생:</span>
            <span class="sr-only video-playlist__play-label"
              >브랜드 필름 — 당신의 하루에 알맞은 온도</span
            >
          </button>
        </div>
      </div>

      <div class="video-playlist__sidebar">
        <ul class="video-playlist__list" aria-label="영상 목록">
          <li class="video-playlist__item">
            <a
              class="video-playlist__link"
              href="https://www.youtube.com/watch?v=VIDEO_ID_1"
              data-video-id="VIDEO_ID_1"
              aria-current="true"
            >
              <span class="video-playlist__thumb">
                <img class="video-playlist__thumb-image" src="./assets/images/photo1.avif" alt="" />
                <span class="video-playlist__duration"
                  ><span class="sr-only">재생 시간</span>2:48</span
                >
              </span>
              <span class="video-playlist__title">브랜드 필름 — 당신의 하루에 알맞은 온도</span>
            </a>
          </li>
          <li class="video-playlist__item">
            <a
              class="video-playlist__link"
              href="https://www.youtube.com/watch?v=VIDEO_ID_2"
              data-video-id="VIDEO_ID_2"
            >
              <span class="video-playlist__thumb">
                <img class="video-playlist__thumb-image" src="./assets/images/photo2.avif" alt="" />
                <span class="video-playlist__duration"
                  ><span class="sr-only">재생 시간</span>4:12</span
                >
              </span>
              <span class="video-playlist__title"
                >BAZZAR가 일하는 방식 — 보이지 않는 곳까지 세심하게</span
              >
            </a>
          </li>
          <li class="video-playlist__item">
            <a
              class="video-playlist__link"
              href="https://www.youtube.com/watch?v=VIDEO_ID_3"
              data-video-id="VIDEO_ID_3"
            >
              <span class="video-playlist__thumb">
                <img class="video-playlist__thumb-image" src="./assets/images/photo3.avif" alt="" />
                <span class="video-playlist__duration"
                  ><span class="sr-only">재생 시간</span>3:05</span
                >
              </span>
              <span class="video-playlist__title"
                >처음 방문하셨나요? 3분 만에 살펴보는 BAZZAR 이용 가이드</span
              >
            </a>
          </li>
          <li class="video-playlist__item">
            <a
              class="video-playlist__link"
              href="https://www.youtube.com/watch?v=VIDEO_ID_4"
              data-video-id="VIDEO_ID_4"
            >
              <span class="video-playlist__thumb">
                <img class="video-playlist__thumb-image" src="./assets/images/photo4.avif" alt="" />
                <span class="video-playlist__duration"
                  ><span class="sr-only">재생 시간</span>5:30</span
                >
              </span>
              <span class="video-playlist__title"
                >고객이 직접 전하는 이야기 | 다시 찾게 되는 이유</span
              >
            </a>
          </li>
        </ul>
        <a
          class="btn btn--outline video-playlist__channel"
          href="https://www.youtube.com/@CHANNEL_HANDLE"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="ri-youtube-fill" aria-hidden="true"></i>
          유튜브 채널 바로가기<span class="sr-only"> (새 창)</span>
        </a>
      </div>
    </div>
  </div>
</section>
