<!-- CONSULT WRITE: 온라인 상담 글쓰기 — 이름·비밀번호·연락처·제목·내용·비밀글·보안문자·약관 동의 + 취소/등록 (서브 공통)
  용도 예: 온라인 상담, 1:1 문의 작성 / 스타일은 게시판 입력 폼 공용 블록 .board-form
  - 검증·보안문자·완료 안내: assets/js/board-form.js (목업용, 실제는 서버 저장 후 상세/목록으로 이동)
  - 비밀번호: 비밀글 열람·수정 시 본인 확인용 (실제 이식 시 서버에서 해시 저장)
  - 비밀글은 기본 체크 (상담 내용 보호)
-->
<section class="board-form" aria-labelledby="consult-write-title">
  <div class="container">
    <h2 class="sr-only" id="consult-write-title">온라인 상담 글쓰기</h2>

    <form class="board-form__form" action="consult.html" method="post" novalidate data-success="상담 글이 등록되었습니다. 확인 후 빠르게 답변드리겠습니다.">
      <div class="board-form__panel">
        <p class="board-form__note"><span class="board-form__req" aria-hidden="true">*</span>는 필수 표기 항목입니다.</p>

        <div class="board-form__list">
          <div class="board-form__cols board-form__cols--fields">
            <div class="board-form__row">
              <label class="board-form__label" for="cw-name">이름<span class="board-form__req" aria-hidden="true">*</span></label>
              <input class="board-form__input" type="text" id="cw-name" name="name" placeholder="이름을 입력해 주세요." autocomplete="name" required data-error="이름을 입력해 주세요." />
            </div>
            <div class="board-form__row">
              <label class="board-form__label" for="cw-password">비밀번호<span class="board-form__req" aria-hidden="true">*</span></label>
              <input class="board-form__input" type="password" id="cw-password" name="password" placeholder="4자리 이상 입력해 주세요." autocomplete="new-password" minlength="4" aria-describedby="cw-password-help" required data-error="비밀번호를 입력해 주세요." data-error-short="비밀번호를 4자리 이상 입력해 주세요." />
              <p class="board-form__help" id="cw-password-help">글을 확인하거나 수정할 때 필요해요.</p>
            </div>
          </div>

          <div class="board-form__row">
            <label class="board-form__label" for="cw-tel">연락처<span class="board-form__req" aria-hidden="true">*</span></label>
            <input class="board-form__input" type="tel" id="cw-tel" name="tel" placeholder="숫자만 입력해 주세요." inputmode="numeric" autocomplete="tel" minlength="9" required data-digits data-error="연락처를 입력해 주세요." data-error-short="연락처를 정확히 입력해 주세요." />
          </div>

          <div class="board-form__row">
            <label class="board-form__label" for="cw-subject">제목<span class="board-form__req" aria-hidden="true">*</span></label>
            <input class="board-form__input" type="text" id="cw-subject" name="subject" placeholder="제목을 입력해 주세요." maxlength="60" required data-error="제목을 입력해 주세요." />
          </div>

          <div class="board-form__row">
            <label class="board-form__label" for="cw-content">내용<span class="board-form__req" aria-hidden="true">*</span></label>
            <textarea class="board-form__input board-form__textarea" id="cw-content" name="content" placeholder="상담받고 싶은 내용을 자세히 적어 주세요." required data-error="내용을 입력해 주세요."></textarea>
          </div>

          <div class="board-form__row board-form__row--check">
            <input class="board-form__checkbox" type="checkbox" id="cw-secret" name="secret" checked />
            <label class="board-form__check" for="cw-secret">비밀글로 등록 <span class="board-form__help">(작성자와 관리자만 볼 수 있어요)</span></label>
          </div>

          <div class="board-form__row">
            <label class="board-form__label" for="cw-captcha">보안문자<span class="board-form__req" aria-hidden="true">*</span></label>
            <div class="board-form__captcha">
              <span class="board-form__captcha-code" aria-hidden="true" data-captcha>000000</span>
              <span class="sr-only" id="cw-captcha-hint">화면에 보이는 보안문자 여섯 자리를 입력해 주세요.</span>
              <input class="board-form__input" type="text" id="cw-captcha" name="captcha" inputmode="numeric" maxlength="6" placeholder="보안문자를 입력해 주세요." autocomplete="off" aria-describedby="cw-captcha-hint" required data-captcha-input data-error="보안문자를 입력해 주세요." />
            </div>
          </div>

          <div class="board-form__row board-form__row--check">
            <input class="board-form__checkbox" type="checkbox" id="cw-agree" name="agree" required data-error="이용약관 및 개인정보 수집·이용에 동의해 주세요." />
            <label class="board-form__check" for="cw-agree">이용약관 및 개인정보 수집·이용 동의<span class="board-form__req" aria-hidden="true">*</span></label>
            <a class="board-form__terms" href="#">[보기]</a>
          </div>
        </div>

        <p class="board-form__status" role="status" aria-live="polite"></p>
      </div>

      <div class="board-form__actions">
        <a class="board-form__cancel" href="consult.html">취소</a>
        <button class="board-form__submit" type="submit">등록</button>
      </div>
    </form>
  </div>
</section>
