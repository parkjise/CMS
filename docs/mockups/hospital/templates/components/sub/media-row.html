<!-- MEDIA ROW: 사진 + 제목·설명 가로 배치 (서브 공통)
  용도 예: 브랜드 소개 첫 문단, 공간 소개, 대표 메시지
-->
<section class="media-row" aria-labelledby="media-row-title">
  <header class="section-head">
    <p class="section-head__eyebrow" lang="en">Our Story</p>
    <h2 class="section-head__title" id="sub-content-title">
      작은 온기가 모여<br />
      오래 기억되는 브랜드가 됩니다.
    </h2>
    <p class="section-head__desc">
      BAZZAR는 처음 만나는 순간부터 그 이후까지, 한결같은 마음으로 곁을 지킵니다.
    </p>
  </header>
  <div class="container media-row__inner">
    <figure class="media-row__photo">
      <img
        class="media-row__image"
        src="./assets/images/unsplash/about-lounge.jpg"
        alt="원형 좌석과 따뜻한 조명이 있는 넓은 라운지"
        loading="lazy"
      />
    </figure>
    <div class="media-row__body">
      <h3 class="media-row__title" id="media-row-title">
        왜 BAZZAR는 처음부터 끝까지<br />
        한 곳에서 함께할까요?
      </h3>
      <p class="media-row__text">
        상담부터 관리까지, 고객에게 필요한 모든 과정을<br />
        하나의 공간에서 끊김 없이 이어갑니다.<br />
        준비와 실행, 회복과 관리가 자연스럽게 연결되는<br />
        — 오래 머물고 싶은 경험을 지향합니다.
      </p>
    </div>
  </div>
</section>
