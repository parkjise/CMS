<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 은은한 화이트-실버 선용 그라데이션 -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#cfd6e2" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="80%" stop-color="#909cb3" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- 투명 배경에서도 선이 선명하게 보이도록 돕는 미세한 빛 퍼짐 필터 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 토러스 구조체 (배경 태그 제거됨) -->
  <g transform="translate(250, 250)" stroke="url(#lineGrad)" stroke-width="1.15" fill="none" opacity="0.85" filter="url(#glow)">
