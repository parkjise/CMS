<section class="oliva-hero" id="hero">
  <div class="oliva-hero__inner">
    <div class="oliva-hero__content">
      <p class="oliva-eyebrow oliva-hero__eyebrow">YEONHUI, SEOUL — EST. 2024</p>
      <h1 class="oliva-hero__title-en">
        <span class="oliva-reveal-line">A casa,</span>
        <span class="oliva-reveal-line">con amore.</span>
      </h1>
      <h2 class="oliva-hero__title-kr">
        <span class="oliva-reveal-line">좋은 날은,</span>
        <span class="oliva-reveal-line">좋은 식탁에서.</span>
      </h2>
      <p class="oliva-hero__desc">
        제철의 맛, 손으로 빚은 파스타, 그리고 와인 한 잔.<br />
        연희동 골목에서 만나는 우리의 작은 이탈리아.
      </p>
      <div class="oliva-hero__actions">
        <a href="#reservation" class="oliva-btn oliva-btn--primary" data-action="scroll" data-target="#reservation">
          <span>식탁에 초대합니다</span>
          <img src="./assets/images/icon-arrow-up-right.svg" alt="" class="oliva-btn__icon" aria-hidden="true" />
        </a>
        <a href="#menu" class="oliva-link-arrow" data-action="scroll" data-target="#menu">
          메뉴 둘러보기 ↗
        </a>
      </div>
    </div>

    <div class="oliva-hero__visual">
      <!-- 아치형 히어로 슬라이더 -->
      <div class="oliva-hero__slider" id="heroSlider" aria-roledescription="carousel" aria-label="올리바 카사 갤러리">
        <div class="oliva-hero__slides">
          <!-- Slide 1 -->
          <div class="oliva-hero__slide is-active" data-index="0" data-quote="A little Italy, a little closer.">
            <img src="./assets/images/dining-room.png" alt="햇살이 비치는 올리바 카사의 다이닝 홀" class="oliva-hero__image" />
          </div>
          <!-- Slide 2 -->
          <div class="oliva-hero__slide" data-index="1" data-quote="Warm candlelight, quiet conversations.">
            <img src="./assets/images/candlelit-table.png" alt="촛불이 켜진 아늑한 코너 테이블" class="oliva-hero__image" />
          </div>
          <!-- Slide 3 -->
          <div class="oliva-hero__slide" data-index="2" data-quote="Handmade pasta every single morning.">
            <img src="./assets/images/pasta-making.png" alt="매일 아침 정성으로 빚는 생면" class="oliva-hero__image" />
          </div>
        </div>

        <!-- 슬라이더 컨트롤러 (닷 네비게이션) -->
        <div class="oliva-hero__nav" aria-label="슬라이드 선택">
          <button type="button" class="oliva-hero__dot is-active" data-slide="0" aria-label="1번 슬라이드 보기"></button>
          <button type="button" class="oliva-hero__dot" data-slide="1" aria-label="2번 슬라이드 보기"></button>
          <button type="button" class="oliva-hero__dot" data-slide="2" aria-label="3번 슬라이드 보기"></button>
        </div>
      </div>

      <div class="oliva-hero__caption">
        <span class="oliva-hero__quote" id="heroQuote">A little Italy, a little closer.</span>
        <span class="oliva-hero__hint">천천히, 아래로 ↓</span>
      </div>
    </div>
  </div>
</section>
