<section class="oliva-location" id="location">
  <div class="oliva-location__inner">
    <div class="oliva-location__info">
      <!-- Col 1: Location -->
      <div class="oliva-location__col oliva-location__col--address">
        <p class="oliva-eyebrow oliva-eyebrow--light">VENITE A TROVARCI</p>
        <h2 class="oliva-location__title">
          연희동 골목,<br />
          올리브빛 문을 열면.
        </h2>
        <p class="oliva-location__address">
          서울 서대문구 연희로11길 18, 1층<br />
          연희동 주민센터에서 도보 3분
        </p>
        <button type="button" class="oliva-btn oliva-btn--light oliva-location__map-btn" data-action="map">
          <span>네이버 지도로 길 찾기</span>
          <img src="./assets/images/icon-arrow-up-right.svg" alt="" class="oliva-btn__icon" aria-hidden="true" />
        </button>
        <p class="oliva-location__notice">
          전용 주차 공간이 없습니다. 인근 공영주차장 또는 대중교통을 이용해 주세요.
        </p>
      </div>

      <!-- Col 2: Hours & Contact -->
      <div class="oliva-location__col oliva-location__col--hours">
        <div class="oliva-location__hours-group">
          <p class="oliva-eyebrow oliva-eyebrow--light">ORARI &amp; CONTATTI</p>
          <dl class="oliva-service-times">
            <div class="oliva-service-time">
              <dt class="oliva-service-time__label">Lunch</dt>
              <dd class="oliva-service-time__value">11:30–15:00</dd>
            </div>
            <div class="oliva-service-time">
              <dt class="oliva-service-time__label">Dinner</dt>
              <dd class="oliva-service-time__value">17:30–22:00</dd>
            </div>
            <div class="oliva-service-time">
              <dt class="oliva-service-time__label">Last order</dt>
              <dd class="oliva-service-time__value">14:00 / 21:00</dd>
            </div>
          </dl>
          <p class="oliva-service-times__closed">매주 월요일은 쉬어갑니다.</p>
        </div>

        <div class="oliva-location__contact-divider"></div>

        <div class="oliva-location__contact-group">
          <p class="oliva-location__phone">02–332–0418</p>
          <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="oliva-location__instagram">
            Instagram @olivacasa.seoul ↗
          </a>
        </div>
      </div>

      <!-- Col 3: SNS -->
      <div class="oliva-location__col oliva-location__col--sns">
        <div class="oliva-sns" aria-label="소셜 미디어 채널">
          <a href="#" class="oliva-sns__link" aria-label="카카오톡">
            <img src="./assets/images/icon-kakaotalk.svg" alt="" class="oliva-sns__icon" />
          </a>
          <a href="#" class="oliva-sns__link" aria-label="인스타그램">
            <img src="./assets/images/icon-instagram.svg" alt="" class="oliva-sns__icon" />
          </a>
          <a href="#" class="oliva-sns__link" aria-label="페이스북">
            <img src="./assets/images/icon-facebook.svg" alt="" class="oliva-sns__icon" />
          </a>
          <a href="#" class="oliva-sns__link" aria-label="유튜브">
            <img src="./assets/images/icon-youtube.svg" alt="" class="oliva-sns__icon" />
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
