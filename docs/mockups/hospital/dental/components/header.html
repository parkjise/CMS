<header class="dental-header" id="header">
  <div class="dental-header__inner">
    <a href="index.html" class="dental-brand" aria-label="ALBA DENTAL 홈으로 이동">
      <span class="dental-brand__mark" aria-hidden="true">A</span>
      <span class="dental-brand__text">
        <span class="dental-brand__name">ALBA DENTAL</span>
        <span class="dental-brand__sub">DENTAL CLINIC</span>
      </span>
    </a>

    <nav class="dental-header__nav" aria-label="주요 메뉴">
      <ul class="dental-nav-list">
        <li class="dental-nav-list__item"><a href="#about" class="dental-nav-link">병원 소개</a></li>
        <li class="dental-nav-list__item"><a href="#treatments" class="dental-nav-link">진료 안내</a></li>
        <li class="dental-nav-list__item"><a href="#doctors" class="dental-nav-link">의료진</a></li>
        <li class="dental-nav-list__item"><a href="#location" class="dental-nav-link">오시는 길</a></li>
        <li class="dental-nav-list__item"><a href="#notice" class="dental-nav-link">병원 소식</a></li>
      </ul>
    </nav>

    <div class="dental-header__actions">
      <a href="tel:0212345678" class="dental-header__tel" aria-label="전화 문의 02-1234-5678">02-1234-5678</a>
      <a href="#reservation" class="dental-btn dental-btn--primary dental-header__btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        예약·상담
      </a>

      <!-- 로그인 -->
      <a href="#" class="dental-header__icon" aria-label="로그인">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg>
      </a>

      <!-- 다국어 -->
      <div class="dental-lang" id="dentalLang">
        <button type="button" class="dental-lang__btn" id="dentalLangBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="언어 선택">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 4 5.6 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.6-4-9s1.4-6.4 4-9z"/></svg>
          <span class="dental-lang__cur" id="dentalLangCur">KOR</span>
          <i class="dental-lang__caret" aria-hidden="true"></i>
        </button>
        <ul class="dental-lang__list" role="listbox" aria-label="언어">
          <li><button type="button" role="option" data-lang="KOR" aria-selected="true">KOR · 한국어</button></li>
          <li><button type="button" role="option" data-lang="ENG" aria-selected="false">ENG · English</button></li>
          <li><button type="button" role="option" data-lang="JPN" aria-selected="false">JPN · 日本語</button></li>
          <li><button type="button" role="option" data-lang="CHN" aria-selected="false">CHN · 中文</button></li>
        </ul>
      </div>

      <button
        type="button"
        class="dental-header__toggle"
        id="dentalMenuToggle"
        aria-label="전체 메뉴 열기"
        aria-expanded="false"
        aria-controls="dentalDrawer"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="dental-drawer-backdrop" id="dentalDrawerBackdrop" aria-hidden="true"></div>
  <nav class="dental-drawer" id="dentalDrawer" aria-label="모바일 전체 메뉴" aria-hidden="true">
    <ul class="dental-drawer__list">
      <li><a href="#about" class="dental-drawer__link">병원 소개</a></li>
      <li><a href="#treatments" class="dental-drawer__link">진료 안내</a></li>
      <li><a href="#doctors" class="dental-drawer__link">의료진</a></li>
      <li><a href="#location" class="dental-drawer__link">오시는 길</a></li>
      <li><a href="#notice" class="dental-drawer__link">병원 소식</a></li>
      <li><a href="#reservation" class="dental-drawer__link dental-drawer__link--accent">예약·상담</a></li>
    </ul>
    <p class="dental-drawer__tel">대표전화 <a href="tel:0212345678">02-1234-5678</a></p>
  </nav>
</header>
