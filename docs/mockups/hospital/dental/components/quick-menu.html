<!-- ALBA 치과 플로팅 퀵메뉴 & TOP 버튼 & 간편예약 모달 패널 (templates 포팅) -->
<aside class="dental-float-quick" id="dentalFloatQuick" aria-label="빠른 메뉴 및 상단 이동">
  <div class="dental-float-quick__box">
    <ul class="dental-float-quick__list">
      <!-- 01 간편예약 (패널 오픈) -->
      <li class="dental-float-quick__item">
        <button type="button" class="dental-float-quick__btn dental-float-quick__btn--primary" data-consult-open aria-label="간편 진료예약 신청 열기" aria-haspopup="dialog" aria-expanded="false">
          <div class="dental-float-quick__ico">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>

              <path d="M10 16h4"/>

      <!-- 02 네이버예약 -->

            </svg>
          </div>
          <span>네이버예약</span>
        </a>
      </li>

      <!-- 03 카톡상담 -->
      <li class="dental-float-quick__item">
        <a href="https://pf.kakao.com" target="_blank" rel="noopener noreferrer" class="dental-float-quick__btn" aria-label="카카오톡 1:1 상담 (새창)">

            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.085.495.231l2.468 3.348V8.108c0-.345.282-.63.63-.63.345 0 .627.285.627.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
            </svg>
          </div>
          <span>라인</span>
        </a>

        <a href="#" class="dental-float-quick__btn" aria-label="위챗 1:1 상담">
          <div class="dental-float-quick__ico dental-float-quick__ico--wechat">

            </svg>
          </div>
          <span>위챗</span>
        </a>
      </li>

      <!-- 06 인스타그램 (Instagram) -->
      <li class="dental-float-quick__item">
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="dental-float-quick__btn" aria-label="ALBA 인스타그램 (새창)">
          <div class="dental-float-quick__ico dental-float-quick__ico--insta">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
            </svg>
          </div>
          <span>인스타</span>
        </a>
      </li>

      <!-- 07 유튜브 (YouTube) -->
      <li class="dental-float-quick__item">
        <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="dental-float-quick__btn" aria-label="ALBA 공식 유튜브 채널 (새창)">
          <div class="dental-float-quick__ico dental-float-quick__ico--youtube">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
          </div>
          <span>유튜브</span>
        </a>
      </li>

      <!-- 08 오시는길 -->
      <li class="dental-float-quick__item">
        <a href="#location" class="dental-float-quick__btn" aria-label="진료안내 및 오시는 길">
          <div class="dental-float-quick__ico">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <span>오시는길</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- TOP 버튼 (스크롤 시 활성화) -->
  <button type="button" class="dental-float-quick__top" id="dentalQuickTop" aria-label="페이지 맨 위로 이동">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
    <span>TOP</span>
  </button>
</aside>

<!-- 간편예약 폼 패널 (templates 포팅 모달 다이얼로그) -->
<div class="dental-consult-backdrop" id="dentalConsultBackdrop" aria-hidden="true"></div>
<section class="dental-consult-panel" id="dentalConsultPanel" role="dialog" aria-modal="true" aria-labelledby="dentalConsultTitle" aria-hidden="true">
  <button class="dental-consult-panel__close" type="button" id="dentalConsultClose" aria-label="간편예약 닫기">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 6L6 18M6 6l12 12"/>
    </svg>
  </button>

  <div class="dental-consult-panel__head">
    <span class="dental-consult-panel__badge">FAST APPOINTMENT</span>
    <h2 class="dental-consult-panel__title" id="dentalConsultTitle">간편 예약 · 상담</h2>
    <p class="dental-consult-panel__desc">희망하시는 진료 항목과 일정을 남겨주시면<br />전담 상담사가 빠른 시간 안에 확인 전화를 드립니다.</p>
  </div>

  <form class="dental-consult-panel__form" id="dentalConsultForm" novalidate>
    <div class="dental-consult-field">
      <input class="dental-consult-input" type="text" id="consult-name" name="name" autocomplete="name" placeholder=" " required />
      <label class="dental-consult-label" for="consult-name">성함을 입력해주세요<span aria-hidden="true">*</span></label>
    </div>

    <div class="dental-consult-field">
      <input class="dental-consult-input" type="tel" id="consult-phone" name="phone" inputmode="tel" autocomplete="tel" placeholder=" " required />
      <label class="dental-consult-label" for="consult-phone">연락처를 입력해주세요 (- 제외)<span aria-hidden="true">*</span></label>
    </div>

    <div class="dental-consult-field dental-consult-field--select">
      <label class="sr-only" for="consult-topic">진료 상담 분야</label>
      <select class="dental-consult-input" id="consult-topic" name="topic" required>
        <option value="">진료 상담 분야를 선택해주세요</option>
        <option value="aesthetic">무삭제 라미네이트 · 심미치료</option>
        <option value="implant">3D 네비게이션 임플란트</option>
        <option value="orthodontics">치아교정 · 인비절라인</option>
        <option value="general">일반진료 · 스케일링 · 충치</option>
        <option value="consult">기타 진료 및 비용 문의</option>
      </select>
      <svg class="dental-consult-arrow" viewBox="0 0 10 6" width="10" height="6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 1l4 4 4-4"/>
      </svg>
    </div>

    <div class="dental-consult-agree">
      <input class="dental-consult-check sr-only" type="checkbox" id="consult-agree-call" name="agreeCall" required />
      <label class="dental-consult-check-label" for="consult-agree-call">
        <span class="dental-consult-box" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4"/></svg>
        </span>
        <span>상담 연락 수신 동의 (필수)</span>
      </label>
    </div>

    <div class="dental-consult-agree">
      <input class="dental-consult-check sr-only" type="checkbox" id="consult-agree-privacy" name="agreePrivacy" required />
      <label class="dental-consult-check-label" for="consult-agree-privacy">
        <span class="dental-consult-box" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 4"/></svg>
        </span>
        <span>개인정보 수집 및 이용 동의 (필수)</span>
      </label>
      <a class="dental-consult-more" href="#privacy" target="_blank" rel="noopener">자세히보기</a>
    </div>

    <p class="dental-consult-status" id="dentalConsultStatus" role="status" aria-live="polite"></p>

    <button class="dental-consult-submit" type="submit">
      <span>간편예약 신청하기</span>
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>
    </button>
  </form>
</section>
