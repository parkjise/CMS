<!-- LU치과 스타일 플로팅 퀵메뉴 & TOP 버튼 -->
<aside class="dental-float-quick" id="dentalFloatQuick" aria-label="빠른 메뉴 및 상단 이동">
  <div class="dental-float-quick__box">
    <ul class="dental-float-quick__list">
      <li class="dental-float-quick__item">
        <a href="#reservation" class="dental-float-quick__btn dental-float-quick__btn--primary" aria-label="간편 진료예약">
          <div class="dental-float-quick__ico">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
              <path d="M12 14v4"/>
              <path d="M10 16h4"/>
            </svg>
          </div>
          <span>간편예약</span>
        </a>
      </li>

      <li class="dental-float-quick__item">
        <a href="https://booking.naver.com" target="_blank" rel="noopener noreferrer" class="dental-float-quick__btn" aria-label="네이버 실시간 예약 (새창)">
          <div class="dental-float-quick__ico dental-float-quick__ico--naver">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M16.273 12.845 7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727v12.845z"/>
            </svg>
          </div>
          <span>네이버예약</span>
        </a>
      </li>

      <li class="dental-float-quick__item">
        <a href="https://pf.kakao.com" target="_blank" rel="noopener noreferrer" class="dental-float-quick__btn" aria-label="카카오톡 1:1 상담 (새창)">
          <div class="dental-float-quick__ico dental-float-quick__ico--kakao">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12 3c-5.523 0-10 3.582-10 8 0 2.827 1.83 5.309 4.622 6.702l-1.173 4.31a.5.5 0 0 0 .762.535l5.05-3.342c.243.023.49.035.739.035 5.523 0 10-3.582 10-8s-4.477-8-10-8z"/>
            </svg>
          </div>
          <span>카톡상담</span>
        </a>
      </li>

      <li class="dental-float-quick__item">
        <a href="#location" class="dental-float-quick__btn" aria-label="진료안내 및 오시는 길">
          <div class="dental-float-quick__ico">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <span>오시는길</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- TOP 버튼 (스크롤 시 활성화) -->
  <button type="button" class="dental-float-quick__top" id="dentalQuickTop" aria-label="페이지 맨 위로 이동">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
    <span>TOP</span>
  </button>
</aside>
