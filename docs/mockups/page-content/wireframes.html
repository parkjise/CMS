let current=0,heroTitle='기술로 새로운 가치를 만듭니다',heroDesc='비즈니스 혁신을 위한 IT 솔루션';const $=id=>document.getElementById(id);function b(t,act='알림: '+t){return `<button onclick="alert('${act}')">${t}</button>`}function field(t,v=''){return `<label class="label">${t}</label><input class="field" value="${v}" placeholder="${t}">`}function select(t,values){return `<label class="label">${t}</label><select class="field">${values.map(v=>`<option>${v}</option>`).join('')}</select>`}function wrap(t,content,actions=''){return `<div class="toolbar"><b>${t}</b><div class="btns">${actions}</div></div><div class="body">${content}</div>`}function tbl(rows,head=['제목','유형/URL','상태','수정일','관리']){return `<div class="table"><div class="tr">${head.map(h=>`<span>${h}</span>`).join('')}</div>${rows.map(r=>`<div class="tr"><b>${r[0]}</b><span>${r[1]}</span><span class="tag">${r[2]}</span><span class="muted">11.20</span>${b('수정')}</div>`).join('')}</div>`}function metrics(labels){return `<div class="metricrow">${labels.map(x=>`<div class="metric">${x[0]}<b>${x[1]}</b></div>`).join('')}</div>`}function tiles(names){return `<div class="cards">${names.map(n=>`<div class="card"><div class="block"></div><b>${n}</b><p class="muted">미리보기 및 설정</p>${b('선택')}</div>`).join('')}</div>`}function renderBody(i){switch(i){case 0:return wrap('페이지 관리',`<div class="filters"><input class="field" placeholder="페이지명 또는 주소 검색"><select class="field"><option>전체 구분</option><option>기본</option><option>직접 만듦</option></select><select class="field"><option>전체 상태</option><option>공개</option><option>숨김</option></select>${b('검색')}</div>${tbl([['홈','/','기본 · 공개'],['병원 소개','/about','기본 · 공개'],['　└ 의료진','/doctors','직접 · 공개'],['이벤트','/event','직접 · 숨김']],['페이지','주소','구분 · 상태','수정일','관리'])}<div class="hint">홈은 삭제·숨김할 수 없고, 템플릿 기본 페이지는 숨김만 가능합니다.</div>`,'<span class="muted">직접 만든 페이지 2/5</span>'+b('+ 페이지 추가'));case 1:return wrap('새 페이지 추가',`${field('페이지명*','의료진 소개')}<label class="label">주소*</label><input class="field" value="doctors"><p class="muted" style="margin-top:-8px">/hospital-a/doctors · ✓ 사용할 수 있는 주소예요</p>${select('상위 페이지 (메뉴 묶음)',['없음','병원 소개'])}${select('시작 방식',['빈 페이지','기존 페이지 복제','추천 구성'])}${select('메뉴 표시',['표시','숨김'])}${select('공개 상태',['공개','숨김 (관리자 미리보기만)'])}<div class="panel"><b>SEO (비우면 사이트 기본값)</b>${field('SEO 제목','의료진 소개 | 하나치과')}${field('메타 설명','전문 의료진을 소개합니다.')}<label><input type="checkbox"> 검색 결과에서 제외</label></div>`,b('취소')+b('만들기'));case 2:return `<div class="toolbar"><b>페이지 디자인 편집기</b><div class="btns">${b('PC / 모바일')}${b('미리보기')}${b('발행')}</div></div><div class="builder"><div class="side"><b>섹션 트리</b>${['헤더','메인 비주얼','서비스','푸터'].map(x=>`<div class="item" onclick="alert('${x} 선택')">≡ ${x}</div>`).join('')}${b('+ 섹션')}</div><div class="canvasarea"><div class="canvas"><div class="sitehead"><b>NEXT COMPANY</b><span>ABOUT　SERVICE</span></div><div class="hero selected"><small>MAIN VISUAL</small><h2 id="heroTitle">${heroTitle}</h2><p id="heroDesc">${heroDesc}</p>${b('자세히 보기')}</div><div class="services">${['웹 개발','AI 솔루션','IT 컨설팅'].map(x=>`<div class="service">${x}</div>`).join('')}</div></div></div><div class="side"><b>속성 설정</b><label class="label">배너 제목</label><input class="field" value="${heroTitle}" oninput="heroTitle=this.value;document.getElementById('heroTitle').textContent=this.value"><label class="label">설명</label><textarea class="field" oninput="heroDesc=this.value;document.getElementById('heroDesc').textContent=this.value">${heroDesc}</textarea>${b('임시저장')}</div></div>`;case 3:return wrap('섹션 라이브러리',tiles(['히어로 배너','서비스 카드','이미지 + 텍스트','FAQ','CTA','갤러리']),b('+ 새 섹션'));case 4:return wrap('위젯 데이터 연결',`<div class="split"><div>${['서비스 카드','FAQ','연혁'].map(x=>`<div class="item">${x}</div>`).join('')}</div><div>${select('입력 방식',['콘텐츠 연결','직접 입력'])}${select('데이터 소스',['서비스 소개','FAQ','기업 연혁'])}${select('출력 방식',['카드형','목록형','갤러리형'])}<div class="panel"><b>필드 매핑</b><p>카드 제목 ← 서비스명</p><p>설명 ← 서비스 설명</p><p>이미지 ← 대표 이미지</p></div>${b('미리보기')}</div></div>`,b('적용'));case 5:return wrap('미리보기',`<div class="filters"><select class="field"><option>이벤트 (/event · 숨김)</option><option>홈</option></select>${b('PC')}${b('태블릿')}${b('모바일')}</div><div class="canvas" style="min-height:300px"><div class="sitehead"><b>하나치과</b><span>병원 소개　이벤트</span></div><div class="hero"><small>SUB HERO</small><h2>겨울 이벤트</h2></div></div><div class="hint">숨김 페이지는 관리자 미리보기에서만 보입니다. 준비가 끝나면 공개로 바꾸세요. 발행·버전·예약 발행은 후속 단계입니다.</div>`,b('공개로 전환'));case 6:return wrap('콘텐츠 목록',`${metrics([['전체','120'],['발행','85'],['검토','15'],['초안','20']])}<div class="filters"><input class="field" placeholder="콘텐츠 검색"><select class="field"><option>전체 유형</option><option>서비스</option></select>${b('검색')}</div>${tbl([['회사 소개','일반','발행'],['서비스 소개','서비스','초안'],['기업 연혁','연혁','발행'],['고객 FAQ','FAQ','초안']])}`,`<button onclick="openScreen(7)">+ 콘텐츠 등록</button>`);case 7:return wrap('콘텐츠 작성',`${field('콘텐츠 제목','신규 서비스 소개')}${select('콘텐츠 유형',['서비스 소개','일반','FAQ'])}<div class="panel"><b>본문 에디터</b><p class="muted">H1　H2　B　I　링크　이미지　✨ AI</p><div contenteditable="true" style="min-height:125px;outline:1px dashed #ccd4dd;padding:15px">콘텐츠 본문을 입력하세요.</div></div>${field('태그','AI, CMS')}${b('✨ AI 문장 개선')}`,b('임시저장')+b('검토 요청'));case 8:return wrap('콘텐츠 유형 및 필드',`<div class="split"><div>${['일반 콘텐츠','서비스 소개','제품 소개','기업 연혁','FAQ'].map(x=>`<div class="item">${x}</div>`).join('')}</div><div><b>서비스 소개 · 필드 구성</b>${['서비스명 / 텍스트','설명 / 에디터','이미지 / 미디어','CTA / URL'].map(x=>`<div class="item">☰　${x}</div>`).join('')}${b('+ 필드 추가')}</div></div>`,b('+ 유형 추가'));case 9:return wrap('공통 콘텐츠·블록',tiles(['공통 CTA','히어로 배너','서비스 카드','고객사 로고','공통 FAQ','문의 안내']),b('+ 블록 등록'));case 10:return wrap('카테고리 및 태그',`<div class="split"><div>${['▾ 서비스','　├ IT 개발','　└ 컨설팅','▾ 회사소개','　└ 연혁'].map(x=>`<div class="item">${x}</div>`).join('')}</div><div>${field('카테고리 이름','서비스')}${select('상위 카테고리',['없음','서비스','회사소개'])}${b('저장')}<div class="panel"><b>태그 관리</b><p>AI　CMS　자동화　웹개발</p>${b('태그 병합')}</div></div></div>`,b('+ 카테고리'));case 11:return wrap('AI 콘텐츠 센터',`${select('작업 유형',['초안 작성','요약','번역','SEO 제안'])}${field('주제','AI 기반 업무 자동화')}${field('핵심 키워드','AI, CMS')}${select('브랜드 톤',['전문적','친근한','간결한'])}<div class="panel"><b>AI 생성 결과</b><p class="muted">실제 AI 연동 전 결과 표시 영역</p>${b('편집기로 가져오기')}</div>`,b('✨ AI 생성'));case 12:return wrap('콘텐츠 승인 관리',`${metrics([['검토 대기','5'],['승인','12'],['반려','2'],['예약','3']])}${tbl([['신규 서비스 안내','김담당','검토중'],['제품 소개 개정','이관리','승인'],['회사 연혁 변경','박담당','반려']],['제목','담당자','상태','요청일','관리'])}<div class="panel"><b>검토 의견</b><textarea class="field" placeholder="의견을 입력하세요"></textarea>${b('반려')} ${b('승인')}</div>`);case 13:return wrap('다국어 콘텐츠',`<div class="btns">${['한국어','English','日本語','中文'].map(x=>b(x)).join('')}</div><div class="split" style="grid-template-columns:1fr 1fr;margin-top:15px"><div>${field('원문 제목','회사 소개')}<textarea class="field" rows="8">기업의 비전과 핵심 가치를 소개합니다.</textarea></div><div>${field('번역 제목','About Us')}<textarea class="field" rows="8">Introducing our vision and core values.</textarea></div></div>${b('✨ AI 번역')} ${b('변경 비교')}`,b('번역 검토 요청'));case 14:return wrap('콘텐츠 성과 분석',`${metrics([['조회수','24,810'],['방문자','8,420'],['클릭률','4.2%'],['전환수','126']])}<div class="panel"><b>조회 추이 · 샘플 데이터</b><div class="chart">${[30,50,45,70,62,83,65,92,75,85].map(h=>`<span style="height:${h}%"></span>`).join('')}</div></div><div class="panel"><b>인기 콘텐츠 TOP 3</b><p>1. 신규 서비스 안내</p><p>2. 회사 소개</p><p>3. 서비스 이용 가이드</p></div><div class="hint">실제 운영 시 분석 서비스와 연동합니다.</div>`);}}
function openScreen(i){current=i;document.querySelectorAll('aside button').forEach((b,n)=>b.classList.toggle('active',n===i));let d=defs[i];$('code').textContent=d[0]+' / '+(i<6?'PAGE MANAGEMENT':'CONTENT MANAGEMENT');$('title').textContent=d[1];$('description').textContent=d[2];$('screen').innerHTML=renderBody(i);$('features').innerHTML=d[3].map(x=>`<li>${x}</li>`).join('');$('cautions').innerHTML=d[4].map(x=>`<li>${x}</li>`).join('');window.scrollTo(0,0)}defs.forEach((d,i)=>{let b=document.createElement('button');b.textContent=d[0]+'　'+d[1];b.onclick=()=>openScreen(i);$(i<6?'pm':'cm').appendChild(b)});openScreen(0);
</script></html>
