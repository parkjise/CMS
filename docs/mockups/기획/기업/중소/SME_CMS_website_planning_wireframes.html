else if(p.type==='organization'){h+=`<div class="section"><h3>조직 구성</h3><div class="ph" style="height:200px">조직도 이미지 / 조직 노드</div></div>`}
else if(p.type==='greeting'){h+=`<div class="section"><div class="cmsRow"><div class="ph" style="min-height:180px">대표자 사진</div><div><h3>대표 인사말</h3><p class="smallInfo">기업의 비전과 고객에 대한 약속을 설명하는 문구입니다.</p><div class="lines"></div><div class="lines"></div><div class="lines small"></div></div></div></div>`}
else {for(let i=0;i<Math.min(arr.length,6);i++){let a=arr[i];h+=`<div class="section"><div class="sectionName">SECTION ${String(i+1).padStart(2,'0')}</div><h3>${E(a)}</h3>`;if(i%2===0)h+=`<div class="cmsRow"><div class="ph">대표 이미지 / 블록</div><div><div class="lines"></div><div class="lines"></div><div class="lines small"></div></div></div>`;else h+=`<div class="cards"><div class="ph sm">콘텐츠 1</div><div class="ph sm">콘텐츠 2</div><div class="ph sm">콘텐츠 3</div></div>`;h+='</div>'}}
return `<div class="wire ${device==='mobile'?'device':''}"><div class="siteHeader"><span class="logo">COMPANY</span><span class="siteNav">회사소개　 사업분야　 포트폴리오　 홍보센터　 고객지원</span><span>☰</span></div>${h}<div style="background:#1b2d43;color:#dbe4f0;padding:22px 25px;font-size:10px">COMPANY　|　기업정보 · 주소 · 전화 · 이메일<br/>개인정보처리방침　 이용약관　 Copyright © Company.</div></div>`}
function renderPage(p){const tags=split(p.sections).map(x=>`<span class="tag">${E(x)}</span>`).join('');document.getElementById('main').innerHTML=`<div class="top"><div><div class="kicker">USER WEBSITE / ${E(p.group)}</div><h1 class="title">${E(p.name)} <span class="chip">${E(p.required)}</span></h1><div class="muted">${E(p.goal)}</div></div><div class="toolbar"><button class="btn" onclick="window.print()">인쇄 / PDF 저장</button></div></div><div class="card"><div class="label">화면 정의 · PAGE SPEC</div><table class="spec"><tr><th>메뉴 경로</th><td>${E(p.group)} / ${E(p.name)}</td></tr><tr><th>화면 목적</th><td>${E(p.goal)}</td></tr><tr><th>화면 구성</th><td>${tags}</td></tr><tr><th>CMS 입력 필드</th><td>${E(p.cms_fields).replaceAll('|','<br>')}</td></tr><tr><th>사용자 행동</th><td>${E(p.actions)}</td></tr><tr><th>예외·검수</th><td>${E(p.exceptions)}</td></tr></table></div><div class="card"><div class="top"><div><div class="label">USER SCREEN WIREFRAME</div><div class="muted">컴포넌트 배치 구조 · 실제 디자인 시 컬러·타이포·사진 적용</div></div><div class="toolbar"><button class="btn ${device==='desktop'?'selected':''}" onclick="device='desktop';render()">PC</button><button class="btn ${device==='mobile'?'selected':''}" onclick="device='mobile';render()">모바일</button></div></div><div style="margin-top:15px">${wireSections(p)}</div></div><div class="card"><div class="label">관리자 편집 흐름</div><div class="flow">${['메뉴 진입','콘텐츠 생성/편집','미리보기','저장(초안)','게시/예약','변경 이력 확인'].map(x=>`<div class="step">${x}</div>`).join('<span>→</span>')}</div><p class="muted">관리자는 ${E(p.name)} 관련 데이터를 등록·수정하고 화면 노출 및 게시 상태를 제어합니다. 관련 페이지는 데이터 모델을 재사용하되 권한을 별도로 부여할 수 있습니다.</p></div>`}
function renderAdmin(a){let desc=ADM.find(x=>x[0]===a)?.[1]||'';let fields=a==='문의 관리'?['문의 리스트 · 검색 · 상태 필터','문의 상세 · 담당자 · 처리 메모','접수 / 확인 / 진행 / 완료 / 스팸','개인정보 보관·파기 정책']:a==='게시판 관리'?['게시판 유형 · 목록형 / 갤러리형 / FAQ형','게시글 목록 · 생성 / 수정 / 삭제 / 복구','필드 정의 · 디자인 연결 · 권한','임시 / 예약 / 공개 / 비공개']:a==='페이지 관리'?['페이지 트리 · 페이지 추가','섹션 추가 · 삭제 · 드래그 순서','콘텐츠 연결 · 미리보기 · 버전','게시 / 예약 / 롤백']:a==='메뉴 관리'?['1/2차 메뉴 목록 · 순서 변경','페이지 연결 · 외부 링크','메뉴명 · 슬러그 · 노출 설정','상위메뉴 정렬·최대 깊이']:['목록 조회 · 검색 · 정렬','신규 등록 · 수정 · 삭제','노출 여부 · 공개 범위','저장 · 미리보기 · 게시'];document.getElementById('main').innerHTML=`<div class="kicker">CMS ADMIN SCREEN</div><h1 class="title">${E(a)} · 관리자 와이어프레임</h1><p class="muted">${E(desc)}</p><div class="card"><div class="label">관리자 화면 와이어프레임</div><div class="cmsShell"><div class="cmsSide">CMS ADMIN${ADM.map(x=>`<div class="${x[0]===a?'on':''}">${E(x[0])}</div>`).join('')}</div><div class="cmsPanel"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">${E(a)}</b><button class="btn primary">+ 새 항목</button></div><div class="cmsField">검색어 입력　│　상태: 전체　│　카테고리: 전체　│　검색</div><div style="border:1px solid #e1e7ee;background:white;border-radius:6px;padding:10px;margin:12px 0"><div style="background:#f1f5fa;font-size:11px;padding:10px">□　항목명　　　　　 수정일　　　　　 상태　　　　관리</div>${[1,2,3,4].map(i=>`<div style="border-top:1px solid #e3eaf1;font-size:11px;padding:10px">□　${E(a)} 데이터 ${i}　　　 2026-11-10　　　 공개　　수정 · 더보기</div>`).join('')}</div><div class="cmsRow">${fields.map(x=>`<div class="cmsField">${E(x)}</div>`).join('')}</div></div></div></div><div class="card"><div class="label">상세 요구사항</div><table class="spec">${fields.map((x,i)=>`<tr><th>기능 ${i+1}</th><td>${E(x)}</td></tr>`).join('')}<tr><th>기본 권한</th><td>최고관리자 / 콘텐츠 관리자 / 작성자 / 열람자로 구분. 삭제·게시·배포는 권한 별도.</td></tr><tr><th>공통 정책</th><td>검색·정렬·페이징·확인 대화상자·감사 로그·실수 복구·키보드 접근성.</td></tr></table></div>`}
function intro(){let counts=DATA.filter(p=>p.required==='필수').length;document.getElementById('main').innerHTML=`<div class="kicker">WEBSITE TEMPLATE · PLANNING SPEC v1.0</div><h1 class="title">일반 중소기업형 CMS 홈페이지<br/>전체 페이지 상세 기획서 & UI 와이어프레임</h1><p class="muted">방문자 홈페이지 ${DATA.length}개 화면 · 필수 ${counts}개 · 선택 ${DATA.length-counts}개 · 관리자 ${ADM.length}개 영역. 좌측 메뉴를 선택하면 페이지별 상세 정의와 PC/모바일 와이어프레임을 확인할 수 있습니다.</p><div class="overviewStats"><div class="stat"><span class="muted">상위 메뉴</span><b>5개</b></div><div class="stat"><span class="muted">전체 페이지</span><b>${DATA.length}개</b></div><div class="stat"><span class="muted">필수 페이지</span><b>${counts}개</b></div><div class="stat"><span class="muted">관리자 영역</span><b>${ADM.length}개</b></div></div><div class="card"><div class="label">사이트맵 / INFORMATION ARCHITECTURE</div><div class="grid">${NAV.map(([g,arr])=>`<div style="border:1px solid #e3e8f0;border-radius:9px;padding:15px"><b>${g}</b>${arr.map(n=>{let p=DATA.find(x=>x.name===n);return `<button class="navBtn" style="color:#244565;padding:6px" onclick="openPage('${n}')">${n} <small style="color:#8292a5">${p.required}</small></button>`}).join('')}</div>`).join('')}</div></div><div class="card"><div class="label">템플릿 구조 정책</div><table class="spec"><tr><th>공통 레이아웃</th><td>헤더(로고·GNB·모바일 메뉴), 서브 비주얼/브레드크럼, 본문, CTA, 푸터</td></tr><tr><th>콘텐츠 모듈</th><td>일반 페이지(회사소개), 구조형 데이터(연혁·제품·실적·인증), 게시판(공지·뉴스·FAQ), 폼(문의)</td></tr><tr><th>편집 정책</th><td>관리자 편집 → 미리보기 → 초안 저장 → 게시(또는 예약). 모든 수정은 버전 이력 보존</td></tr><tr><th>반응형</th><td>PC 기준 1200px 콘텐츠 폭 권장, 태블릿 768~1199px, 모바일 767px 이하</td></tr><tr><th>필수 정책</th><td>접근성(키보드·대체텍스트·초점), SEO(제목·설명·URL), HTTPS, 권한, 개인정보보호, 백업</td></tr></table></div><div class="card"><div class="label">방문자 핵심 경로</div><div class="flow">${['홈','사업분야','제품/서비스 상세','문의하기','접수 완료'].map(x=>`<div class="step">${x}</div>`).join('<span>→</span>')}</div><p class="muted">두 번째 핵심 경로: 홈 → 포트폴리오 → 프로젝트 상세 → 문의하기. 기업 신뢰 확인 경로: 홈 → 회사개요 → 연혁/인증 → 오시는 길.</p></div>`}
function policy(){document.getElementById('main').innerHTML=`<div class="kicker">IMPLEMENTATION POLICY</div><h1 class="title">권한 · 게시 · 검수 · 단계별 구축</h1><div class="card"><div class="label">기본 콘텐츠 상태</div><div class="flow">${['작성 중','검토 요청','승인 완료','예약/게시','비공개/종료'].map(x=>`<div class="step">${x}</div>`).join('<span>→</span>')}</div><p class="muted">1인 운영 기업은 검토 승인 단계 생략 가능. 공개중 콘텐츠를 수정할 때는 초안을 별도 보관하여 저장만으로 공개 내용이 변경되지 않도록 합니다.</p></div><div class="card"><div class="label">역할 및 권한 매트릭스</div><table class="spec"><tr><th>역할</th><td>열람 / 작성 / 수정 / 게시 / 삭제 / 사용자관리</td></tr><tr><th>최고관리자</th><td>전체 권한. 보안·권한·도메인 설정 관리.</td></tr><tr><th>콘텐츠 관리자</th><td>전체 콘텐츠 작성·수정·게시. 사용자 및 시스템 설정 제외.</td></tr><tr><th>작성자</th><td>본인 초안 작성·수정, 승인 요청. 게시 및 영구 삭제 불가.</td></tr><tr><th>열람자</th><td>허용된 자료와 문의 내역 열람만 가능.</td></tr></table></div><div class="card"><div class="label">MVP 우선순위</div><table class="spec"><tr><th>P0 · 필수</th><td>기본 5메뉴, 필수 페이지, 페이지/메뉴/게시판/문의 CRUD, 미디어, 기본 템플릿, 권한, SEO 기본</td></tr><tr><th>P1 · 확장</th><td>색상·컴포넌트 프리셋, 예약 게시, 버전 비교, 카탈로그 필터, 인증 만료 알림, 고급 분석</td></tr><tr><th>P2 · 향후</th><td>다국어, AI 초안/요약, AEO·GEO 고급 보조, 확장형 페이지 빌더</td></tr></table></div><div class="card"><div class="label">QA 체크리스트</div>${['메뉴 노출/숨김 및 URL 이동 정상','이미지 대체텍스트·키보드 탐색·명도 대비','모바일 360px부터 주요 화면 깨짐 없음','첨부파일 크기·형식 제한 및 악성 파일 차단','문의 동의·접수 알림·처리 상태·삭제/파기 정상','비공개/초안 URL 직접 접근 차단','메타 title/description·canonical·사이트맵 정상','관리자 편집·미리보기·게시·복구 및 감사 로그 정상'].map(x=>`<p style="font-size:13px"><input type="checkbox"> ${x}</p>`).join('')}</div>`}
function render(){if(current==='intro')intro();else if(current==='policy')policy();else if(current.startsWith('CMS:'))renderAdmin(current.slice(4));else renderPage(DATA.find(p=>p.name===current)||DATA[0])}
function filterNav(){let q=document.getElementById('search').value.trim().toLowerCase();document.querySelectorAll('.navBtn').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'':'none')}
renderSidebar();render();
</script></body></html>
