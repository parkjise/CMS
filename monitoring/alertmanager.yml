# Alertmanager 설정 (T-083) — Slack 알림
# Slack 웹훅 URL은 시크릿 파일로 주입한다(Alertmanager는 env 치환 미지원):
#   monitoring/secrets/slack_url  (git 제외, 배포 시 생성)
global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/slack_url

route:
  receiver: slack-default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: slack-critical
      repeat_interval: 1h

receivers:
  - name: slack-default
    slack_configs:
      - channel: "#cms-alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

  - name: slack-critical
    slack_configs:
      - channel: "#cms-alerts-critical"
        send_resolved: true
        title: "🚨 [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ["alertname"]
