# ─────────────────────────────────────────────────────────────────────────
# CMS 프로덕션 Nginx 설정 (T-080)
#
# 도메인 라우팅 (기본 도메인: cms.example.com — 실제 도메인으로 치환)
#   cms.example.com, www.cms.example.com   → 고객 홈페이지 (Next.js, client:3000)
#   admin.cms.example.com                  → 테넌트 관리자 (Vite 정적, admin:80)
#   system.cms.example.com                 → 슈퍼 어드민 (Vite 정적, superadmin:80)
#   /api/**                                → FastAPI 백엔드 (backend:8000)
#   그 밖의 도메인(고객 연결 도메인)         → 고객 홈페이지, 인증서는 접속 도메인으로 선택 (T-137)
#
# SSL: Let's Encrypt (certbot webroot). 발급 절차는 nginx/README.md 참조.
# ─────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;              # 버전 노출 차단
    client_max_body_size 20m;       # 이미지 업로드 20MB 상한과 일치

    # ── Gzip 압축 ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml image/svg+xml
        font/woff font/woff2;

    # ── Rate Limiting (IP당 100 req/min) ───────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── WebSocket/SSE 업그레이드 매핑 ───────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── 업스트림 (내부 Docker 네트워크 서비스명) ────────────────────────────
    # 정적 upstream 대신 변수 + resolver로 "지연 해석"을 사용한다.
    # → 프론트 서비스(client/admin/superadmin)가 아직 안 떠 있어도 nginx가
    #   기동/재로드에 실패하지 않고, 요청 시점에 Docker DNS로 해석(다운 시 502).
    #   각 location에서 `set $upstream_x ...; proxy_pass http://$upstream_x$request_uri;`
    map $host $backend_host    { default "backend:8000"; }
    map $host $client_host     { default "client:3000"; }
    map $host $admin_host      { default "admin:80"; }
    map $host $superadmin_host { default "superadmin:80"; }
    map $host $minio_host      { default "minio:9000"; }

    # 접속 도메인 → 인증서 폴더. 파일 경로에 들어가므로 도메인 문자만 허용 (T-137)
    map $ssl_server_name $custom_cert_name {
        default                        invalid;
        "~^[A-Za-z0-9][A-Za-z0-9.-]*$" $ssl_server_name;
    }

    # ── 공통 SSL 설정 ──────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP Stapling (인증서 발급 후 활성 — 체인 파일 필요)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=30s;   # Docker 내장 DNS
    resolver_timeout 5s;

    # ── 프록시 공통 헤더 (snippet 재사용) ───────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # ── 보안 헤더 (전 응답 공통) ────────────────────────────────────────────
    # HSTS: 1년, 서브도메인 포함, preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ════════════════════════════════════════════════════════════════════════
    # HTTP :80 — ACME 챌린지 + HTTPS 강제 리다이렉트
    # ════════════════════════════════════════════════════════════════════════
    server {
        # 고객 연결 도메인도 여기로 — 인증서 발급(ACME)은 이 서버의 웹루트로 확인한다 (T-137)
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Let's Encrypt 갱신용 웹루트 (HTTP 유지)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ════════════════════════════════════════════════════════════════════════
    # 고객 홈페이지 — cms.example.com (+www), Next.js SSR
    # ════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name cms.example.com www.cms.example.com;

        ssl_certificate     /etc/nginx/certs/live/cms.example.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/cms.example.com/privkey.pem;

        # API → 백엔드 (rate limit 적용, burst 허용)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://$backend_host$request_uri;
        }

        # SSE 실시간 알림 — 버퍼링 비활성, 장기 커넥션
        location /api/v1/notifications/stream {
            proxy_pass http://$backend_host$request_uri;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection '';
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # 업로드 · 템플릿 샘플 이미지 (MinIO 버킷 cms-media, CDN_BASE_URL=https://도메인/cms-media)
        # 읽기만 — 쓰기 · 삭제는 백엔드가 내부망으로. 버킷 목록은 MinIO 정책상 403
        location /cms-media/ {
            limit_except GET { deny all; }
            proxy_pass http://$minio_host$request_uri;
            proxy_set_header Host $minio_host;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header Server;
        }

        # Next.js 정적 자산 장기 캐시
        location /_next/static/ {
            proxy_pass http://$client_host$request_uri;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://$client_host$request_uri;
            # 이 블록에 proxy_set_header 를 쓰면 위 공통 헤더가 상속되지 않는다 — 전부 다시.
            # 빠지면 홈페이지가 Host 를 내부 이름으로 받아 고객 도메인을 알 수 없다 (T-137)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ════════════════════════════════════════════════════════════════════════
    # 테넌트 관리자 — admin.cms.example.com (Vite SPA 정적)
    # ════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name admin.cms.example.com;

        ssl_certificate     /etc/nginx/certs/live/cms.example.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/cms.example.com/privkey.pem;

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://$backend_host$request_uri;
        }

        location / {
            proxy_pass http://$admin_host$request_uri;
        }
    }

    # ════════════════════════════════════════════════════════════════════════
    # 슈퍼 어드민 — system.cms.example.com (Vite SPA 정적, /api/super 전용)
    # ════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name system.cms.example.com;

        ssl_certificate     /etc/nginx/certs/live/cms.example.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/cms.example.com/privkey.pem;

        # 슈퍼 어드민은 더 엄격한 rate limit
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://$backend_host$request_uri;
        }

        location / {
            proxy_pass http://$superadmin_host$request_uri;
        }
    }

    # ════════════════════════════════════════════════════════════════════════
    # 고객 연결 도메인 (T-137, 기획서 15.3) — 위 server_name 에 없는 모든 도메인
    #
    # 도메인마다 설정을 만들지 않는다. 인증서는 접속 도메인 이름으로 찾으므로 발급만 되면
    # 재시작 없이 바로 쓰이고, 없는 도메인은 TLS 연결이 실패한다. 파일은 워커(nginx 사용자)가
    # 읽으므로 발급 때 그룹 읽기 권한을 준다 (services/domain.py 의 deploy hook).
    # 연결 여부는 홈페이지 미들웨어가 다시 확인한다.
    # ════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/live/$custom_cert_name/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/$custom_cert_name/privkey.pem;
        ssl_stapling off;   # 변수 인증서는 stapling 불가

        # 인증서와 다른 도메인의 요청을 같은 연결로 보내는 것 차단
        if ($host != $ssl_server_name) {
            return 421;
        }

        # 고객 도메인이므로 서브도메인까지 강제하지 않는다 (add_header 는 상속이 끊겨 전부 다시)
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 방문자용 공개 API 만 — 관리자 · 슈퍼 어드민 API 는 고객 도메인에 열지 않는다
        location /api/public/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://$backend_host$request_uri;
        }

        location /api/ {
            return 404;
        }

        location /_next/static/ {
            proxy_pass http://$client_host$request_uri;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://$client_host$request_uri;
            # 이 블록에 proxy_set_header 를 쓰면 위 공통 헤더가 상속되지 않는다 — 전부 다시.
            # 빠지면 홈페이지가 Host 를 내부 이름으로 받아 고객 도메인을 알 수 없다 (T-137)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
