services:
  postgres:
    image: postgres:17
    container_name: cms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    # 프로덕션에서는 포트 외부 노출 없음 (내부 네트워크만)
    networks:
      - internal

  redis:
    image: redis:8-alpine
    container_name: cms-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - internal

  minio:
    image: minio/minio:latest
    container_name: cms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: always
    networks:
      - internal

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: cms-backend:latest
    container_name: cms-backend
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - internal
      - external

  # Celery 워커 — 알림/이미지/도메인 비동기 태스크 (백엔드 이미지 재사용)
  worker:
    image: cms-backend:latest
    container_name: cms-worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment: *backend_env
    depends_on:
      - backend
      - redis
    restart: always
    networks:
      - internal

  # Celery Beat — 예약 태스크 스케줄러 (구독 갱신·인증서 갱신 등)
  beat:
    image: cms-backend:latest
    container_name: cms-beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment: *backend_env
    depends_on:
      - backend
      - redis
    restart: always
    networks:
      - internal

  # 고객 홈페이지 (Next.js standalone)
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    image: cms-client:latest
    container_name: cms-client
    environment:
      NODE_ENV: production
    restart: always
    networks:
      - external

  # 테넌트 관리자 (Vite SPA / Nginx)
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    image: cms-admin:latest
    container_name: cms-admin
    restart: always
    networks:
      - external

  # 슈퍼 어드민 (Vite SPA / Nginx)
  superadmin:
    build:
      context: .
      dockerfile: apps/superadmin/Dockerfile
    image: cms-superadmin:latest
    container_name: cms-superadmin
    restart: always
    networks:
      - external

  nginx:
    image: nginx:1.28-alpine
    container_name: cms-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # 커스텀 도메인(T-100) 동적 서버 블록
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      # Let's Encrypt ACME 웹루트 (certbot과 공유)
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - client
      - admin
      - superadmin
    restart: always
    networks:
      - external

  # Let's Encrypt 인증서 자동 발급/갱신 (webroot 방식)
  # 최초 발급: nginx/README.md 참조. 이후 12시간마다 갱신 시도.
  certbot:
    image: certbot/certbot:latest
    container_name: cms-certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt        # nginx가 읽는 인증서 저장소
      - certbot_www:/var/www/certbot           # ACME 챌린지 웹루트
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    restart: always

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certbot_www:

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge
