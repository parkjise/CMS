services:
  postgres:
    image: postgres:17
    container_name: cms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    # 프로덕션에서는 포트 외부 노출 없음 (내부 네트워크만)
    networks:
      - internal

  redis:
    image: redis:8-alpine
    container_name: cms-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - internal

  minio:
    image: minio/minio:latest
    container_name: cms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: always
    networks:
      - internal
      # nginx 가 /cms-media/ (이미지 읽기)를 넘길 수 있게 — 호스트 포트는 열지 않는다
      - external

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: cms-backend:latest
    container_name: cms-backend
    # 운영 설정 전부 (apps/backend/.env.production.example 참고) — 아래 environment 가 우선
    env_file: &backend_env_file
      - ./apps/backend/.env.production
    environment: &backend_env
      # 앱은 일반 권한 계정(RLS 적용) — 배포 시 scripts/init_db_roles.py 로 1회 생성
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-cms_app}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # 소유자 계정 — alembic · init_db_roles · 시드 전용
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      MINIO_ENDPOINT: minio:9000
      APP_ENV: production
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # 저장 직후 홈페이지 캐시 비우기 (T-066-A) — 홈페이지와 같은 비밀 키
      CLIENT_INTERNAL_URL: http://client:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?루트 .env 에 REVALIDATE_SECRET 을 설정하세요}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - internal
      - external

  # Celery 워커 — 알림/이미지/도메인 비동기 태스크 (백엔드 이미지 재사용)
  worker:
    image: cms-backend:latest
    container_name: cms-worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: *backend_env_file
    environment: *backend_env
    depends_on:
      - backend
      - redis
    restart: always
    networks:
      - internal

  # Celery Beat — 예약 태스크 스케줄러 (구독 갱신·인증서 갱신 등)
  beat:
    image: cms-backend:latest
    container_name: cms-beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: *backend_env_file
    environment: *backend_env
    depends_on:
      - backend
      - redis
    restart: always
    networks:
      - internal

  # 고객 홈페이지 (Next.js standalone)
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      # NEXT_PUBLIC_* 는 빌드 때 고정된다 — 루트 .env 의 PUBLIC_DOMAIN 등으로 (배포 체크리스트 B1)
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${PUBLIC_DOMAIN:?루트 .env 에 PUBLIC_DOMAIN 을 설정하세요}/api
        NEXT_PUBLIC_SITE_URL: https://${PUBLIC_DOMAIN}
        NEXT_PUBLIC_ADMIN_URL: https://admin.${PUBLIC_DOMAIN}
        NEXT_PUBLIC_SERVICE_BASE_DOMAIN: ${PUBLIC_DOMAIN}
        NEXT_PUBLIC_CDN_HOSTNAME: ${CDN_HOSTNAME:-${PUBLIC_DOMAIN}}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
        NEXT_PUBLIC_KAKAO_MAP_API_KEY: ${KAKAO_MAP_API_KEY:-}
    image: cms-client:latest
    container_name: cms-client
    environment:
      NODE_ENV: production
      # 서버 렌더링 · 미들웨어는 공개 도메인을 거치지 않고 백엔드를 직접 부른다
      API_INTERNAL_URL: http://backend:8000/api
      # 백엔드가 저장 직후 POST /api/revalidate 로 캐시를 비울 때 확인하는 키 (T-066-A)
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    restart: always
    networks:
      - external

  # 테넌트 관리자 (Vite SPA / Nginx)
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: https://admin.${PUBLIC_DOMAIN:?루트 .env 에 PUBLIC_DOMAIN 을 설정하세요}/api
        VITE_CLIENT_BASE_URL: https://${PUBLIC_DOMAIN}
        VITE_SENTRY_DSN: ${ADMIN_SENTRY_DSN:-}
    image: cms-admin:latest
    container_name: cms-admin
    restart: always
    networks:
      - external

  # 슈퍼 어드민 (Vite SPA / Nginx)
  superadmin:
    build:
      context: .
      dockerfile: apps/superadmin/Dockerfile
      args:
        VITE_API_BASE_URL: https://system.${PUBLIC_DOMAIN:?루트 .env 에 PUBLIC_DOMAIN 을 설정하세요}/api/super
    image: cms-superadmin:latest
    container_name: cms-superadmin
    restart: always
    networks:
      - external

  nginx:
    image: nginx:1.28-alpine
    container_name: cms-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # 커스텀 도메인(T-100) 동적 서버 블록
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      # Let's Encrypt ACME 웹루트 (certbot과 공유)
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - client
      - admin
      - superadmin
    restart: always
    networks:
      - external

  # Let's Encrypt 인증서 자동 발급/갱신 (webroot 방식)
  # 최초 발급: nginx/README.md 참조. 이후 12시간마다 갱신 시도.
  certbot:
    image: certbot/certbot:latest
    container_name: cms-certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt        # nginx가 읽는 인증서 저장소
      - certbot_www:/var/www/certbot           # ACME 챌린지 웹루트
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    restart: always

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certbot_www:

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge
